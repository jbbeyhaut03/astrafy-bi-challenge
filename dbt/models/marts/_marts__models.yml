version: 2

models:
  - name: fct_orders
    description: >
      Order-grain fact table. One row per order header, carrying the two facts
      that are true of an order and absent from the order source: qty_product,
      aggregated up from the line grain in stg_sales, and order_segmentation,
      computed from the customer's own trailing-window order history in
      int_orders_segmented. Both are attributes of the order at this grain and
      are carried here on that basis, not because a specific exercise asked for
      them. Covers all history in the source (2025-07-09 to 2026-12-31) with no
      year filter: the two-year restriction Exercise 4 asks for is a question
      asked of this table, applied in analyses and in Looker, not a property
      stored in it.
    columns:
      - name: order_id
        description: Natural key of the order. The grain of this table.
        data_tests:
          - unique
          - not_null

      - name: client_id
        description: >
          Identifier of the customer who placed the order. Carried on the fact
          row because no customer dimension exists — the source has no
          descriptive customer attributes to put in one.
        data_tests:
          - not_null

      - name: order_date
        description: Calendar date the order was placed. Monthly partition key.
        data_tests:
          - not_null

      - name: net_sales
        description: Order total as recorded on the order header, not recomputed from the lines.
        data_tests:
          - not_null

      - name: qty_product
        description: >
          Total number of product units in the order — the sum of order_qty
          across the order's lines. Repeated products count once per unit.
          not_null here asserts that every order header has at least one
          matching line in stg_sales; a null would mean a header with no lines.
        data_tests:
          - not_null

      - name: order_segmentation
        description: >
          New, Returning or VIP: what the customer was at the moment this order
          was placed, determined by how many orders the same client_id had
          placed in the 365 days strictly before it. 0 prior orders is New,
          1 to 3 is Returning, 4 or more is VIP. Immutable once assigned — it
          depends only on orders that precede this one, never on later ones.
          The window is bounded by the start of the extract (2025-07-09), so
          orders before 2026-07-09 are evaluated against a partial lookback.
          not_null here asserts every order header found a segment; a null
          would mean the join to int_orders_segmented lost a row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New', 'Returning', 'VIP']

    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_orders')


  - name: fct_order_items
    description: >
      Line-grain fact table: one row per product per order, and the finest
      grain available in either source. Passthrough of stg_sales, materialised
      and physically optimised for the datamart layer. Retains every recorded
      sales line, including lines whose order header is absent from the orders
      source; those lines are visible here but are excluded from every
      order-grain model by construction.
    columns:
      - name: order_id
        description: Order the line belongs to. Not unique at this grain.
        data_tests:
          - not_null
      - name: product_id
        description: >
          Product sold on this line. Bare identifier; no descriptive
          product attributes exist in either source.
        data_tests:
          - not_null
      - name: client_id
        description: Customer who placed the parent order.
        data_tests:
          - not_null
      - name: order_date
        description: Date the parent order was placed. Partition key.
        data_tests:
          - not_null
      - name: order_qty
        description: Units of this product sold on this line.
        data_tests:
          - not_null
      - name: net_sales
        description: >
          Net revenue for this line, as NUMERIC. Sums to the parent order
          total on the order header.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_sales')


  - name: rpt_orders_2026_segmented
    description: >
      Exercise 6. One row per order for the reporting year, with its segment.
      A projection of fct_orders filtered to one year — no logic of its own.
      It exists because the exercise asks for the filtered table itself as a
      deliverable; the rpt_ prefix marks it as built for one stated use case
      rather than for reuse. Anything reusable should read fct_orders.
    columns:
      - name: order_id
        description: Unique order identifier. Grain of this table.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: client_id
        description: Customer who placed the order. Cluster key.
        data_tests:
          - not_null
      - name: order_date
        description: >
          Date the order was placed. Partition key; constrained to the
          reporting year.
        data_tests:
          - not_null
      - name: net_sales
        description: Net revenue for the order, as recorded on the order header.
        data_tests:
          - not_null
      - name: qty_product
        description: Total units across all lines of the order.
        data_tests:
          - not_null
      - name: order_segmentation
        description: >
          New, Returning or VIP, carried through unchanged from fct_orders.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New', 'Returning', 'VIP']